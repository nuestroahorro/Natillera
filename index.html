<script>
(function(){
'use strict';
/* ========== utilidades de fecha y dinero ========== */
var MS=86400000;
var MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
var KEY='cosecha1';var SERVER_URL=(typeof window!=='undefined'&&window.__SERVER)||'';
function pad(n){return String(n).padStart(2,'0');}
function pd(s){var a=s.split('-').map(Number);return Date.UTC(a[0],a[1]-1,a[2]);}
function fd(ms){var t=new Date(ms);return t.getUTCFullYear()+'-'+pad(t.getUTCMonth()+1)+'-'+pad(t.getUTCDate());}
function diff(a,b){return Math.round((pd(b)-pd(a))/MS);}
function addDays(s,n){return fd(pd(s)+n*MS);}
function addMonths(s,n){var a=s.split('-').map(Number);var t=a[1]-1+n;var y=a[0]+Math.floor(t/12),m=((t%12)+12)%12;var last=new Date(Date.UTC(y,m+1,0)).getUTCDate();return y+'-'+pad(m+1)+'-'+pad(Math.min(a[2],last));}
function realToday(){try{return new Intl.DateTimeFormat('en-CA',{timeZone:'America/Bogota',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());}catch(e){var t=new Date();return t.getFullYear()+'-'+pad(t.getMonth()+1)+'-'+pad(t.getDate());}}
var S=null;
function hoy(){return S.cfg.hoySim||realToday();}
function mesParts(i){var p=S.cfg.inicio.split('-').map(Number);var mm=p[1]-1+i;return {y:p[0]+Math.floor(mm/12),m:((mm%12)+12)%12};}
function mesFecha(i,dia){var q=mesParts(i);return q.y+'-'+pad(q.m+1)+'-'+pad(Math.min(dia,28));}
function mesLabel(i){var q=mesParts(i);return MESES[q.m]+' '+q.y;}
function mesCorto(i){var q=mesParts(i);return MESES[q.m].slice(0,3);}
function fmtFecha(s){if(!s)return '—';var a=s.split('-');return Number(a[2])+' '+MESES[Number(a[1])-1].slice(0,3)+' '+a[0];}
var nf=new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0});
function money(n){return nf.format(Math.round(n||0)).replace(/ /g,' ');}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function pad2(n){return pad(n);}
function norm(s){return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();}
function usuarioDe(so){return so.usuario||String(so.nombre||'').trim().split(/\s+/)[0];}
function pinDe(so){var d=String(so.tel||'').replace(/\D/g,'');return so.pin||(d.length>=4?d.slice(-4):'');}

/* ========== datos ========== */
function defaults(){return {cfg:{multaModo:'mes',multTope:12,baseTope:'acumulado',nombre:'La Cosecha 2026 - 2027',inicio:'2026-12-01',meses:12,diaPago:10,cuotaMin:50000,intSocio:5,intExterno:7,multaCuota:10000,multaInteres:10000,comision:100000,precioNum:50000,pctPremio:50,diaSorteo:15,adminPin:'0000',hoySim:'',demo:false,baseReparto:'ahorro',gastosEnvio:0,cobrarMoraInteres:true,descontarIntereses:true},docs:{},solicitudes:[],notifs:[],leidas:{},soportes:[],socios:[],pagos:{},prestamos:[],sorteos:[],otros:[],nid:{socio:1,prest:1,sorteo:1,sol:1,not:1,sop:1}};}
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

  idx.forEach(function(m){if(m>=s.cfg.meses)return;var f=mesFecha(m,s.cfg.diaSorteo);if(s.sorteos.some(function(x){return x.fecha===f;}))return;s.sorteos.push({id:s.nid.sorteo++,fecha:f,resultado:null,numeros:{}});});
  s.sorteos.sort(function(a,b){return a.fecha<b.fecha?-1:1;});S=prev;}
function seedDemo(){
  var s=defaults();s.cfg.demo=true;s.cfg.hoySim='2027-03-20';S=s;
  var names=['Ana Ruiz','Bruno Salas','Camila Torres','Diego Vargas','Elena Mora','Felipe Rojas','Gloria Díaz','Hugo Castro','Inés Pardo','Jorge León','Karen Soto','Mateo Vega'];

  var r=rng(7);

    if(m===3&&(so.id===5||so.id===9))continue;

  s.prestamos.push({id:1,socio:3,capital:1500000,fecha:'2026-12-12',tasa:5,abonos:[],pagosInt:[{fecha:'2027-01-12',monto:75000},{fecha:'2027-02-12',monto:75000},{fecha:'2027-03-13',monto:75000}]});

  s.prestamos.push({id:3,socio:4,capital:800000,fecha:'2027-02-01',tasa:5,abonos:[],pagosInt:[{fecha:'2027-03-03',monto:40000}]});
  s.prestamos.push({id:4,socio:null,externo:'Persona externa (demo)',codeudor:1,capital:1000000,fecha:'2027-02-15',tasa:7,abonos:[],pagosInt:[{fecha:'2027-03-19',monto:70000}]});
  s.prestamos.push({id:5,socio:1,capital:400000,fecha:'2027-03-10',tasa:5,abonos:[],pagosInt:[]});
  s.prestamos.push({id:6,socio:11,capital:1000000,fecha:'2026-12-20',tasa:5,abonos:[{fecha:'2027-02-01',monto:400000}],pagosInt:[{fecha:'2027-01-19',monto:50000},{fecha:'2027-02-18',monto:50000},{fecha:'2027-03-20',monto:30000}]});
  s.nid.prest=7;
  generarSorteos(s);
  function fill(sr,count,paidCount){var arr=[];for(var n=0;n<100;n++)arr.push(n);
    for(var i=arr.length-1;i>0;i--){var j=Math.floor(r()*(i+1));var t=arr[i];arr[i]=arr[j];arr[j]=t;}
    arr.slice(0,count).forEach(function(n,k){sr.numeros[pad(n)]={socio:(k%12)+1,pagado:k<paidCount};});return arr;}
  var d0=s.sorteos[0],d1=s.sorteos[1],d2=s.sorteos[2];

function cuotaInfo(sid,i,h){
  var so=socioById(sid);var due=mesFecha(i,S.cfg.diaPago);var f=S.pagos[sid+'|'+i];var mc=S.cfg.multaCuota;
  if(f){var mora=Math.max(0,diff(due,f));return {pagada:true,fecha:f,due:due,mora:mora,multa:multaU(mora)*mc,estado:mora?'tarde':'ok',monto:so.cuota};}

  if(mesFecha(i,1)<=h)return {pagada:false,due:due,mora:0,multa:0,estado:'porpagar',monto:so.cuota};

function prestamoInfo(p,h){
  var tasa=p.tasa/100;var mc=S.cfg.cobrarMoraInteres===false?0:S.cfg.multaInteres;
  var abonos=(p.abonos||[]).slice().sort(function(a,b){return a.fecha<b.fecha?-1:1;});
  var pagos=(p.pagosInt||[]).slice().sort(function(a,b){return a.fecha<b.fecha?-1:1;});
  function saldoEn(f){var t=p.capital;abonos.forEach(function(a){if(a.fecha<=f)t-=a.monto;});return t;}
  var acc=0;var pacc=pagos.map(function(x){acc+=x.monto;return {fecha:x.fecha,acc:acc};});
  var periodos=[],cum=0,k=1,prox=null;
  while(k<400){
    var ini=addMonths(p.fecha,k-1),venc=addMonths(p.fecha,k);var base=saldoEn(ini);
    if(base<=0)break;var monto=Math.round(base*tasa);
    if(venc>h){prox={k:k,venc:venc,monto:monto};break;}
    cum+=monto;
    var cov=null;for(var j=0;j<pacc.length;j++){if(pacc[j].acc>=cum-0.5){cov=pacc[j].fecha;break;}}
    var dias=cov?Math.max(0,diff(venc,cov)):Math.max(0,diff(venc,h));
    periodos.push({k:k,ini:ini,venc:venc,monto:monto,cubierto:!!cov,fechaPago:cov,mora:dias,multa:multaU(dias)*mc});
    k++;
  }
  var pagado=pagos.reduce(function(s,x){return s+x.monto;},0);
  var moraC=0,moraP=0;periodos.forEach(function(q){if(q.cubierto)moraC+=q.multa;else moraP+=q.multa;});
  var abonado=abonos.reduce(function(s,x){return s+x.monto;},0);
  return {periodos:periodos,interesGenerado:cum,interesPagado:pagado,interesPendiente:Math.max(0,cum-pagado),capitalPendiente:p.capital-abonado,abonado:abonado,moraCobrada:moraC,moraPendiente:moraP,proximo:prox,vencido:periodos.some(function(q){return !q.cubierto;})};
}
function fondoCalc(){
  var pozo=0,out=[];var c=S.cfg;
  S.sorteos.slice().sort(function(a,b){return a.fecha<b.fecha?-1:1;}).forEach(function(sr){
    var nums=Object.keys(sr.numeros||{}).map(function(k){return {n:k,v:sr.numeros[k]};});
    var vendidos=nums.filter(function(x){return x.v.pagado;}).length;
    var reservados=nums.length-vendidos;
    var recaudo=vendidos*c.precioNum;var mitad=Math.round(recaudo*c.pctPremio/100);
    var util=recaudo-mitad;var premio=mitad+pozo;
    var hecho=sr.resultado!=null&&sr.resultado!=='';var estado='abierto',ganador=null,sal=premio;
    if(hecho){var v=sr.numeros[sr.resultado];if(v&&v.pagado){estado='ganador';ganador=v.socio;sal=0;}else{estado='acumulado';sal=premio;}}
    out.push({sorteo:sr,vendidos:vendidos,reservados:reservados,recaudo:recaudo,premioBase:mitad,pozoPrevio:pozo,premio:premio,utilidad:util,hecho:hecho,estado:estado,ganador:ganador,pozoSalida:sal});
    pozo=sal;

  return {lista:out,pozoActual:pozo};
}

    S.prestamos.forEach(function(p){if(p.socio===so.id){var i2=prestamoInfo(p,h);cap+=i2.capitalPendiente;intp+=i2.interesPendiente;morp+=i2.moraPendiente;}});

  });

  var totalAh=filas.reduce(function(s,x){return s+x.ahorro;},0);var totalAhAct=activos.reduce(function(s,x){return s+x.ahorro;},0);var noDev=filas.filter(function(x){return x.retirado;}).reduce(function(s,x){return s+x.ahorro*(1-rp)-S.cfg.comision/2;},0);

  var utilTotal=intPag+moraC+multasCuota+fondoUtil+otros+(S.cfg.retiroAUtil===false?0:noDev);
  var totCuota=activos.reduce(function(s,x){return s+x.socio.cuota;},0);var envioPct=(+S.cfg.gastosEnvio||0)/100;
  filas.forEach(function(f){if(f.retirado){f.utilidad=0;f.comision=S.cfg.comision;f.envio=Math.round(S.prestamos.filter(function(p){return p.socio===f.socio.id;}).reduce(function(s,p){return s+p.capital;},0)*envioPct);f.devuelve=f.ahorro*rp;f.neto=f.devuelve-f.deuda-f.comision/2-f.envio;return;}var base=S.cfg.baseReparto==='cuota'?(totCuota>0?f.socio.cuota/totCuota:0):(totalAhAct>0?f.ahorro/totalAhAct:0);f.utilidad=utilTotal*base;f.comision=S.cfg.comision;f.envio=Math.round(S.prestamos.filter(function(p){return p.socio===f.socio.id;}).reduce(function(s,p){return s+p.capital;},0)*envioPct);f.neto=f.ahorro+f.utilidad-f.deuda-f.comision-f.envio;});
  var recFondo=fc.lista.reduce(function(s,x){return s+x.recaudo;},0);
  var premios=fc.lista.filter(function(x){return x.estado==='ganador';}).reduce(function(s,x){return s+x.premio;},0);

}

/* ========== PDF de liquidación (generador propio, sin librerías) ========== */
function PDFDoc(){
  var pages=[],cur=null;
  function col(c){return c.map(function(v){return (v/255).toFixed(3);}).join(' ');}
  function enc(t){var o='';t=String(t).replace(/[—–]/g,'-').replace(/[“”]/g,'"').replace(/[‘’]/g,"'").replace(/−/g,'-');for(var i=0;i<t.length;i++){var c=t.charCodeAt(i);o+=c<256?String.fromCharCode(c):'?';}return o.replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)');}
  function wid(t,size,bold){var w=0;for(var i=0;i<t.length;i++){var ch=t[i];w+=/[0-9$]/.test(ch)?556:(ch===','||ch==='.'||ch===' '||ch==='i'||ch==='l'||ch==='|'||ch===':')?278:(ch==='-'?333:(ch==='m'||ch==='W'||ch==='M'?833:(/[A-Z]/.test(ch)?667:530)));}return w*size/1000*(bold?1.05:1);}
  var d={
    page:function(){cur=[];pages.push(cur);return d;},
    rect:function(x,y,w,h,c){cur.push(col(c)+' rg '+x+' '+(842-y-h)+' '+w+' '+h+' re f');return d;},
    line:function(x1,y1,x2,y2,c,lw){cur.push(col(c)+' RG '+(lw||0.6)+' w '+x1+' '+(842-y1)+' m '+x2+' '+(842-y2)+' l S');return d;},
    text:function(x,y,t,size,bold,c,align,maxw){t=String(t);var w=wid(t,size,bold);if(align==='r')x=x-w;else if(align==='c')x=x-w/2;cur.push('BT '+col(c||[31,42,34])+' rg /'+(bold?'F2':'F1')+' '+size+' Tf '+x.toFixed(1)+' '+(842-y).toFixed(1)+' Td ('+enc(t)+') Tj ET');return d;},
    wrap:function(x,y,t,size,maxw,lh,c){var words=String(t).split(' '),ln='',yy=y;words.forEach(function(w){var test=ln?ln+' '+w:w;if(wid(test,size)>maxw&&ln){d.text(x,yy,ln,size,false,c);yy+=lh;ln=w;}else ln=test;});if(ln){d.text(x,yy,ln,size,false,c);yy+=lh;}return yy;},
    build:function(){
      var objs=[];function add(s){objs.push(s);return objs.length;}
      add('<< /Type /Catalog /Pages 2 0 R >>');add('PLACEHOLDER');
      var f1=add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
      var f2=add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
      var kids=[];
      pages.forEach(function(ops){var body=ops.join('\n');var cn=add('<< /Length '+body.length+' >>\nstream\n'+body+'\nendstream');var pn=add('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 '+f1+' 0 R /F2 '+f2+' 0 R >> >> /Contents '+cn+' 0 R >>');kids.push(pn+' 0 R');});
      objs[1]='<< /Type /Pages /Kids ['+kids.join(' ')+'] /Count '+kids.length+' >>';
      var out='%PDF-1.4\n',offs=[];objs.forEach(function(o,i){offs.push(out.length);out+=(i+1)+' 0 obj\n'+o+'\nendobj\n';});
      var xr=out.length;out+='xref\n0 '+(objs.length+1)+'\n0000000000 65535 f \n';offs.forEach(function(o){out+=String(o).padStart(10,'0')+' 00000 n \n';});
      out+='trailer\n<< /Size '+(objs.length+1)+' /Root 1 0 R >>\nstartxref\n'+xr+'\n%%EOF';
      var u=new Uint8Array(out.length);for(var i=0;i<out.length;i++)u[i]=out.charCodeAt(i)&255;return u;
    }
  };
  return d;
}

function chipSol(e){return e==='aprobado'?'<span class="chip ok">Aprobado</span>':(e==='rechazado'?'<span class="chip bad">Rechazado</span>':(e==='espera_cod'?'<span class="chip warn">Esperando al codeudor</span>':'<span class="chip warn">En revisión</span>'));}
function solicitudesMias(so){
  var l=misSolicitudes(so.id);var o='<div class="row sp mt"><h3 style="margin:0">Mis solicitudes</h3><button class="btn primary" data-act="solnueva">+ Solicitar préstamo</button></div>';
  if(!l.length)return o+'<div class="card muted mt">No has hecho solicitudes.</div>';
  return o+'<div class="card list mt">'+l.map(function(x){var cd=x.codeudor?'Codeudor: '+nombreCorto(x.codeudor)+(x.cod?(x.cod.estado==='acepto'?' (aceptó)':(x.cod.estado==='rechazo'?' (rechazó)':' (pendiente)')):''):'';return '<div class="it"><div><b>'+money(x.monto)+'</b><small>'+fmtFecha(x.fecha)+(cd?' · '+cd:'')+(x.nota?' · '+esc(x.nota):'')+'</small></div>'+chipSol(x.estado)+'</div>';}).join('')+'</div>';

function solicitudesAdmin(){

  var o='<div class="card"><h3>Solicitudes de préstamo ('+all.length+')</h3><div class="list">';
  all.forEach(function(x){var so=socioById(x.socio)||{nombre:'—'};var ah=ahorroSocio(x.socio);var cod=x.codeudor?(socioById(x.codeudor)||{nombre:'—'}).nombre:null;var espera=x.estado==='espera_cod';

  return o+'</div></div>';
}


/* ========== notificaciones ========== */
function uKey(){return ui.user.type==='admin'?'admin':ui.user.id;}
function notiAdd(para,texto,extra){S.notifs=S.notifs||[];var n={id:S.nid.not++,para:para,texto:texto,fecha:hoy(),leida:false};if(extra)for(var k in extra)n[k]=extra[k];S.notifs.push(n);return n;}
function nombreCorto(id){var x=socioById(id);return x?x.nombre.split(' ').slice(0,1).join(' '):'—';}
function notifDerivadas(para){
  var h=hoy(),out=[];
  function add(key,texto,tipo){out.push({key:key,texto:texto,tipo:tipo,fecha:h,derivada:true});}
  if(para==='admin'){
    for(var i=0;i<S.cfg.meses;i++){var fa=0;var due=cuotaInfo(S.socios[0]?S.socios[0].id:0,i,h).due;if(due&&diff(h,due)===1){S.socios.forEach(function(so){if(!cuotaInfo(so.id,i,h).pagada)fa++;});add('ac|'+i+'|'+h,'Mañana vence la cuota de '+mesLabel(i)+'. Faltan por pagar '+fa+' de '+S.socios.length+' socios.','cuota');}}
    var ni=[];S.prestamos.forEach(function(p){var pi=prestamoInfo(p,h);if(pi.proximo&&diff(h,pi.proximo.venc)===1)ni.push(nombrePrest(p)+' ('+money(pi.proximo.monto)+')');});
    if(ni.length)add('ap|'+h,'Mañana vencen '+ni.length+' intereses de préstamos: '+ni.join(', ')+'.','prestamo');
  }else{
    for(var m=0;m<S.cfg.meses;m++){var ci=cuotaInfo(para,m,h);if(!ci.pagada&&ci.due){var d=diff(h,ci.due);if(d===1)add('c|'+para+'|'+m+'|'+h,'Recordatorio: mañana vence tu cuota de '+mesLabel(m)+' ('+money(ci.monto)+'). Paga antes del '+fmtFecha(ci.due)+' para evitar multa.','cuota');else if(d===0)add('c0|'+para+'|'+m+'|'+h,'Hoy vence tu cuota de '+mesLabel(m)+' ('+money(ci.monto)+').','cuota');}}
    misPrestamos(para).forEach(function(p){var pi=prestamoInfo(p,h);if(pi.capitalPendiente<=0||!pi.proximo)return;var d=diff(h,pi.proximo.venc);var propio=p.socio===para;
      if(d===1)add('p|'+p.id+'|'+para+'|'+h,(propio?'Mañana vence el interés de tu préstamo':'Mañana vence el interés del préstamo de '+nombrePrest(p)+', que tú respaldas')+' ('+money(pi.proximo.monto)+').','prestamo');
      else if(d===0)add('p0|'+p.id+'|'+para+'|'+h,(propio?'Hoy vence el interés de tu préstamo':'Hoy vence el interés del préstamo de '+nombrePrest(p)+', que tú respaldas')+' ('+money(pi.proximo.monto)+').','prestamo');});
  }
  fondoCalc().lista.forEach(function(x){if(x.hecho)return;var d=diff(h,x.sorteo.fecha);if(d===3||d===1||d===0)add('s|'+x.sorteo.id+'|'+h,d===0?'Hoy es el sorteo del fondo ganador. Premio actual: '+money(x.premio)+'.':'El sorteo del fondo ganador es en '+d+(d===1?' día':' días')+' ('+fmtFecha(x.sorteo.fecha)+'). Premio actual: '+money(x.premio)+'.','evento');});
  return out;
}
function notifLista(para){
  var l=(S.notifs||[]).filter(function(n){return n.para===para;}).map(function(n){return n;});
  var leidas=(S.leidas&&S.leidas[para])||[];
  var d=notifDerivadas(para).map(function(n){n.leida=leidas.indexOf(n.key)>=0;return n;});
  return l.concat(d).sort(function(a,b){return a.fecha<b.fecha?1:(a.fecha>b.fecha?-1:0);});
}
function notifPendientes(para){
  return notifLista(para).filter(function(n){return !n.leida||(n.tipo==='cod'&&solPorId(n.sol)&&solPorId(n.sol).cod&&solPorId(n.sol).cod.estado==='pendiente');}).length;
}
function solPorId(id){return (S.solicitudes||[]).filter(function(x){return x.id===id;})[0];}
function notifView(){
  var para=uKey();var l=notifLista(para);
  var o='<h2>Notificaciones</h2>';
  if(!l.length)return o+'<div class="card muted">No tienes notificaciones.</div>';
  var nuevos=l.map(function(n){return !n.leida;});
  o+='<div class="card">'+l.map(function(n,i){
    var acc='';
    if(n.tipo==='cod'){var x=solPorId(n.sol);if(x&&x.cod){if(x.cod.estado==='pendiente')acc='<div class="row"><button class="btn small primary" data-act="codok" data-id="'+x.id+'">Aceptar</button><button class="btn small danger" data-act="codno" data-id="'+x.id+'">Rechazar</button></div><small>Debes responder para que el administrador pueda revisar la solicitud.</small>';else acc='<div class="row"><span class="chip '+(x.cod.estado==='acepto'?'ok':'bad')+'">'+(x.cod.estado==='acepto'?'Aceptaste el '+fmtFecha(x.cod.fecha):'Rechazaste el '+fmtFecha(x.cod.fecha))+'</span></div><small>Esta decisión ya no se puede cambiar.</small>';}}
    return '<div class="nt'+(nuevos[i]?' nuevo':'')+'"><div>'+esc(n.texto)+'</div><small>'+fmtFecha(n.fecha)+(nuevos[i]?' · nueva':'')+'</small>'+acc+'</div>';}).join('')+'</div><p class="help">Estos avisos aparecen dentro de la app. Los recordatorios por WhatsApp llegarán cuando conectemos el servidor.</p>';
  return o;
}
function marcarLeidas(){
  var para=uKey();var ch=false;
  (S.notifs||[]).forEach(function(n){if(n.para===para&&!n.leida&&n.tipo!=='cod'){n.leida=true;ch=true;}});
  S.leidas=S.leidas||{};var arr=S.leidas[para]=S.leidas[para]||[];
  notifDerivadas(para).forEach(function(n){if(arr.indexOf(n.key)<0){arr.push(n.key);ch=true;}});
  if(ch)save();
}



/* ========== versiones de préstamo, abonos y pago total ========== */
function sigCodigo(){var m=0;S.prestamos.forEach(function(q){var n=parseInt(String(q.codigo||'').replace(/\D/g,''),10);if(n>m)m=n;});return 'P'+String(m+1).padStart(3,'0');}
function codigoBase(p){return p.codigo||('P'+String(p.id).padStart(3,'0'));}
function versionesPrest(p){
  var ab=(p.abonos||[]).slice().sort(function(a,b){return a.fecha<b.fecha?-1:1;});var rest=p.capital,v=1,out=[{v:1,code:codigoBase(p),capital:p.capital,desde:p.fecha,nota:'Desembolso inicial'}];
  ab.forEach(function(a){rest-=a.monto;if(rest>0){v++;out.push({v:v,code:codigoBase(p)+'-V'+v,capital:rest,desde:a.fecha,nota:'Abono de '+money(a.monto)});}else out.push({v:0,code:codigoBase(p),capital:0,desde:a.fecha,nota:'Pagado por completo ('+money(a.monto)+')',saldado:true});});
  return out;
}
function codigoActual(p){var vs=versionesPrest(p);var last=vs[vs.length-1];return last.saldado?codigoBase(p):last.code;}
function interesRequerido(p,h){var pi=prestamoInfo(p,h);return Math.max(0,Math.round(pi.interesGenerado+(pi.proximo?pi.proximo.monto:0)-pi.interesPagado));}
function regAbono(p,f,monto,interes){if(interes>0){p.pagosInt=p.pagosInt||[];p.pagosInt.push({fecha:f,monto:interes});}p.abonos=p.abonos||[];p.abonos.push({fecha:f,monto:monto});}
function regTotal(p,f){var h=f;var req=interesRequerido(p,h);var pi=prestamoInfo(p,h);var cap=pi.capitalPendiente;if(req>0){p.pagosInt=p.pagosInt||[];p.pagosInt.push({fecha:f,monto:req});}if(cap>0){p.abonos=p.abonos||[];p.abonos.push({fecha:f,monto:cap});}p.saldado=true;p.fechaSaldado=f;return {capital:cap,interes:req};}
function histVersiones(p){
  var vs=versionesPrest(p);if(vs.length<2)return '';
  return '<h3>Historial de versiones</h3><div class="card list">'+vs.map(function(x){return '<div class="it"><div><b>'+esc(x.code)+(x.saldado?' · Saldado':'')+'</b><small>'+esc(x.nota)+' · '+fmtFecha(x.desde)+'</small></div><b>'+(x.saldado?'$ 0':money(x.capital))+'</b></div>';}).join('')+'</div><p class="help">Las fechas de pago de interés siguen siendo las del préstamo original.</p>';
}

/* ========== soportes de pago ========== */
function comprimirImagen(file,cb){
  var r=new FileReader();r.onerror=function(){cb(null);};
  r.onload=function(){var im=new Image();im.onerror=function(){cb(null);};im.onload=function(){var max=1280,k=Math.min(1,max/Math.max(im.width,im.height));var c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',0.72));};im.src=r.result;};
  r.readAsDataURL(file);
}
function sopCandidatos(so){
  var h=hoy(),c=[],n=0;
  for(var i=0;i<S.cfg.meses&&n<3;i++){var ci=cuotaInfo(so.id,i,h);if(!ci.pagada){n++;var tot=so.cuota+(ci.multa||0);c.push({key:'c'+i,tipo:'cuota',mes:i,monto:tot,texto:'Cuota de '+mesLabel(i),det:money(so.cuota)+(ci.multa?' + multa '+money(ci.multa):'')});}}
  fondoCalc().lista.forEach(function(x){if(x.hecho)return;Object.keys(x.sorteo.numeros||{}).forEach(function(k){var v=x.sorteo.numeros[k];if(v&&v.socio===so.id&&!v.pagado)c.push({key:'f'+x.sorteo.id+'_'+k,tipo:'fondo',sorteo:x.sorteo.id,num:k,monto:S.cfg.precioNum,texto:'Fondo ganador · número '+k,det:'Sorteo del '+fmtFecha(x.sorteo.fecha)});});});
  S.prestamos.forEach(function(p){if(p.socio!==so.id)return;var pi=prestamoInfo(p,h);if(pi.capitalPendiente<=0)return;
    if(pi.interesPendiente>0)c.push({key:'i'+p.id,tipo:'interes',prestamo:p.id,monto:pi.interesPendiente,texto:'Interés del préstamo de '+money(p.capital),det:'Pendiente'});
    else if(pi.proximo)c.push({key:'i'+p.id,tipo:'interes',prestamo:p.id,monto:pi.proximo.monto,texto:'Interés del préstamo de '+money(p.capital),det:'Vence el '+fmtFecha(pi.proximo.venc)});});
  S.prestamos.forEach(function(p){if(p.socio!==so.id)return;var pi=prestamoInfo(p,h);if(pi.capitalPendiente<=0)return;var req=interesRequerido(p,h);var cod=codigoActual(p);
    c.push({key:'a'+p.id,tipo:'abono',prestamo:p.id,monto:0,variable:true,extra:req,texto:'Abonar a capital · '+cod,det:'Saldo '+money(pi.capitalPendiente)+'. Se suma el interés del período en curso: '+money(req)+'.'});
    c.push({key:'t'+p.id,tipo:'total',prestamo:p.id,monto:pi.capitalPendiente+req,capital:pi.capitalPendiente,extra:req,texto:'Pagar el préstamo completo · '+cod,det:'Capital '+money(pi.capitalPendiente)+' + interés del período '+money(req)});});
  return c;
}
function sopRecalc(){
  var box=document.getElementById('sopbox');if(!box)return;var c=ui.sopC||[];var total=num(box.querySelector('[name=total]').value);var marc=0;
  c.forEach(function(x){var e=box.querySelector('[name="k_'+x.key+'"]');if(e&&e.checked){if(x.variable){var ev=box.querySelector('[name="ma_'+x.prestamo+'"]');marc+=num(ev?ev.value:0)+(x.extra||0);}else marc+=x.monto;}});marc+=num(box.querySelector('[name=otro_monto]').value);
  var d=total-marc,el=box.querySelector('#sopsum'),msg;
  if(!total)msg='<div class="sum warn">Escribe el valor total que transferiste.</div>';
  else if(!marc)msg='<div class="sum warn">Marca lo que estás pagando. Si no estás seguro, puedes enviarlo sin marcar y el administrador completa el detalle.</div>';
  else if(d===0)msg='<div class="sum ok">Todo cuadra: transferiste '+money(total)+' y marcaste '+money(marc)+'.</div>';
  else if(d>0)msg='<div class="sum warn">Transferiste '+money(total)+' y marcaste '+money(marc)+'. Sobran <b>'+money(d)+'</b>. ¿A qué corresponden? Marca un número del fondo, un interés o escribe "Otro".</div>';
  else msg='<div class="sum warn">Marcaste '+money(marc)+' pero transferiste '+money(total)+'. Faltan <b>'+money(-d)+'</b> para cubrir lo marcado.</div>';
  // sugerencia
  var sug='';c=c.filter(function(x){return x.monto>0&&x.tipo!=='total';});if(total>0&&c.length&&c.length<=14){var best=null;for(var m=1;m<(1<<c.length);m++){var sm=0,n=0;for(var i=0;i<c.length;i++)if(m&(1<<i)){sm+=c[i].monto;n++;}if(sm===total&&(!best||n<best.n))best={m:m,n:n};}
    if(best&&d!==0){var nm=[];for(var j=0;j<c.length;j++)if(best.m&(1<<j))nm.push(c[j].texto);sug='<div class="sum ok">Ese valor podría ser: <b>'+esc(nm.join(' + '))+'</b>. <a href="#" data-act="sopsug" data-m="'+best.m+'">Marcar esto</a></div>';}}
  var nh=msg+sug;if(el.__h!==nh){el.__h=nh;el.innerHTML=nh;}
}
function sopImgPrev(){var e=document.getElementById('sopprev');if(!e)return;e.innerHTML=ui.sopImg?'<img class="bigimg" src="'+ui.sopImg+'" alt="Soporte"><p class="help">Foto lista. Puedes cambiarla eligiendo otra.</p>':'<p class="help">Aún no has elegido la foto del soporte.</p>';}
function sopNuevo(){
  var so=socioById(ui.user.id);var c=sopCandidatos(so);ui.sopC=c;ui.sopImg=null;ui.sopCS=c.filter(function(x){return x.monto>0&&x.tipo!=='total';});
  var body='<div id="sopbox"><p class="help">No pagas desde aquí. Solo envías la foto de tu transferencia y el administrador la revisa y registra el pago. Es opcional: si prefieres, puedes decirle el pago al administrador.</p>'+fld('total','Valor total que transferiste','','number','inputmode="numeric"');
  body+='<label>Foto del soporte</label><input type="file" id="sopfile" accept="image/*"><div id="sopprev"></div>';
  body+='<p class="gh" style="margin-top:16px">¿Qué estás pagando? (puedes marcar varias)</p>';
  function grupo(titulo,tipo,vacio){var g=c.filter(function(x){return x.tipo===tipo;});body+='<p class="gh">'+titulo+'</p>';if(!g.length){body+='<p class="help">'+vacio+'</p>';return;}g.forEach(function(x){body+='<label class="chk"><input type="checkbox" name="k_'+x.key+'"><span class="t"><b>'+esc(x.texto)+'</b> · '+money(x.monto)+(x.det&&x.det!==money(x.monto)?'<small>'+esc(x.det)+'</small>':'')+'</span></label>';});}
  grupo('Cuota mensual','cuota','No tienes cuotas pendientes.');
  grupo('Fondo ganador','fondo','No tienes números reservados sin pagar. Reserva tus números en la pestaña Fondo ganador.');
  grupo('Intereses de préstamos','interes','No tienes préstamos vigentes.');
  body+='<p class="gh">Abonar o pagar un préstamo</p>';var gp=c.filter(function(x){return x.tipo==='abono'||x.tipo==='total';});if(!gp.length)body+='<p class="help">No tienes préstamos vigentes.</p>';
  gp.forEach(function(x){body+='<label class="chk"><input type="checkbox" name="k_'+x.key+'"><span class="t"><b>'+esc(x.texto)+'</b>'+(x.tipo==='total'?' · '+money(x.monto):'')+'<small>'+esc(x.det)+'</small>'+(x.variable?'<input name="ma_'+x.prestamo+'" type="number" inputmode="numeric" placeholder="Valor a abonar a capital" style="margin-top:6px">':'')+'</span></label>';});
  body+='<p class="gh">Otro</p><p class="help">Cualquier otro pago.</p>'+fld('otro_monto','Valor','','number','inputmode="numeric"')+fld('otro_nota','Nota (opcional)','')+'<div id="sopsum"></div></div>';
  modal('Subir soporte de pago',body,[CANCEL,{label:'Enviar soporte',cls:'primary',fn:function(v){
    var total=num(v.total);if(total<=0){alert('Escribe el valor total que transferiste.');return false;}if(!ui.sopImg){alert('Elige la foto del soporte.');return false;}
    var items=[],err='';c.forEach(function(x){if(v['k_'+x.key]){var it={tipo:x.tipo,monto:x.monto,texto:x.texto};if(x.mes!=null)it.mes=x.mes;if(x.sorteo!=null){it.sorteo=x.sorteo;it.num=x.num;}if(x.prestamo!=null)it.prestamo=x.prestamo;if(x.tipo==='abono'){var va=num(v['ma_'+x.prestamo]);if(va<=0){err='Escribe el valor a abonar en '+x.texto+'.';return;}it.monto=va;it.interes=x.extra;it.texto=x.texto+' · abono '+money(va);}if(x.tipo==='total'){it.interes=x.extra;it.capital=x.capital;}items.push(it);}});
    if(err){alert(err);return false;}var pm={};items.forEach(function(i){if(i.prestamo!=null){pm[i.prestamo]=pm[i.prestamo]||[];pm[i.prestamo].push(i.tipo);}});for(var kp in pm){if(pm[kp].indexOf('total')>=0&&pm[kp].length>1){alert('Para pagar el préstamo completo no marques interés ni abono del mismo préstamo.');return false;}}
    if(num(v.otro_monto)>0)items.push({tipo:'otro',monto:num(v.otro_monto),texto:'Otro'+(v.otro_nota?': '+v.otro_nota:'')});
    S.soportes=S.soportes||[];var sp={id:S.nid.sop++,socio:so.id,fecha:hoy(),total:total,items:items,img:ui.sopImg,estado:'pendiente'};S.soportes.push(sp);
    notiAdd('admin',so.nombre+' subió un soporte de pago por '+money(total)+'.',{tipo:'soporte',sop:sp.id});ui.sopImg=null;save();render();alert('Soporte enviado. El administrador lo revisará.');}}]);
  sopImgPrev();sopRecalc();
}
function chipSop(e){return e==='confirmado'?'<span class="chip ok">Confirmado</span>':(e==='rechazado'?'<span class="chip bad">Rechazado</span>':'<span class="chip warn">En revisión</span>');}
function mSoportes(so){
  var l=(S.soportes||[]).filter(function(x){return x.socio===so.id;}).sort(function(a,b){return b.id-a.id;});
  var o='<div class="row sp"><h2>Soportes de pago</h2><button class="btn primary" data-act="sopnuevo">+ Subir soporte</button></div><p class="help">Opcional. Sube la foto de tu transferencia y el administrador registra el pago. Aquí no se paga.</p>';
  if(!l.length)return o+'<div class="card muted">Aún no has subido soportes.</div>';
  return o+'<div class="card list">'+l.map(function(x){return '<div class="it" style="align-items:flex-start"><div style="display:flex;gap:12px"><img class="thumb" src="'+x.img+'" data-act="verimg" data-id="'+x.id+'" alt="Soporte"><div><b>'+money(x.total)+'</b><small>'+fmtFecha(x.fecha)+'</small>'+x.items.map(function(i){return '<small>'+esc(i.texto)+' · '+money(i.monto)+'</small>';}).join('')+(x.nota?'<small>'+esc(x.nota)+'</small>':'')+'</div></div>'+chipSop(x.estado)+'</div>';}).join('')+'</div>';
}
function sopPend(){return (S.soportes||[]).filter(function(x){return x.estado==='pendiente';});}
function aSoportes(){

/* ========== tope y cupo de préstamos ========== */
function topeSocio(id){var c=S.cfg,so=socioById(id);if(!so)return 0;return so.cuota*(c.multTope||12);}
function capPend(p){return prestamoInfo(p,hoy()).capitalPendiente;}
function usoPropio(id){return S.prestamos.filter(function(p){return p.socio===id;}).reduce(function(a,p){return a+capPend(p);},0);}
function usoGarantia(id){return S.prestamos.filter(function(p){return p.codeudor===id&&p.socio!==id;}).reduce(function(a,p){var c=capPend(p);return a+Math.min(p.garantizado!=null?p.garantizado:c,c);},0);}
function cupoDisp(id){return Math.max(0,topeSocio(id)-usoPropio(id)-usoGarantia(id));}
function viabilidad(sid,monto,cod){
  var propio=sid?cupoDisp(sid):0;var cd=cod?cupoDisp(cod):0;var exceso=Math.max(0,monto-propio);
  var r={propio:propio,codDisp:cd,exceso:exceso,maxSolo:propio,maxCon:propio+cd,tope:sid?topeSocio(sid):0};
  if(exceso===0)r.ok=true,r.estado='ok';
  else if(!cod)r.ok=false,r.estado='falta_cod';
  else if(exceso<=cd)r.ok=true,r.estado='ok_cod';
  else r.ok=false,r.estado='cod_corto';
  return r;
}
function viabHtml(sid,monto,cod){
  var r=viabilidad(sid,monto,cod),o='';
  if(sid)o+='<div class="help">Tu tope personal es <b>'+money(r.tope)+'</b> (cuota mensual × '+(S.cfg.multTope||12)+'). Ya usas '+money(usoPropio(sid)+usoGarantia(sid))+'. Te quedan <b>'+money(r.propio)+'</b> disponibles.</div>';
  if(!(monto>0))return o+'<div class="help">Escribe el valor para ver si es viable.</div>';
  if(r.estado==='ok')o+='<div class="alert ok">Viable. Está dentro de tu cupo personal.</div>';
  else if(r.estado==='ok_cod')o+='<div class="alert ok">Viable con este codeudor. Tu cupo cubre '+money(r.propio)+' y el codeudor respalda '+money(r.exceso)+'.</div>';
  else if(r.estado==='falta_cod')o+='<div class="alert bad">Sin codeudor solo puedes pedir hasta <b>'+money(r.maxSolo)+'</b>. Para '+money(monto)+' necesitas un socio codeudor que respalde '+money(r.exceso)+'.</div>';
  else o+='<div class="alert bad">El cupo disponible de ese codeudor no alcanza para respaldar '+money(r.exceso)+'. Con él podrías pedir hasta <b>'+money(r.maxCon)+'</b>. Prueba con otro codeudor.</div>';
  if(cod&&r.estado!=='cod_corto'&&monto>0)o+='<div class="help">Con este codeudor el máximo sería <b>'+money(r.maxCon)+'</b>. Su ahorro no se muestra, solo su cupo.</div>';
  return o;
}

document.addEventListener('click',function(e){var t=e.target.closest('[data-act]');if(!t)return;var f=A[t.dataset.act];if(f){e.preventDefault();f(t);}});
document.addEventListener('submit',function(e){
  var fm=e.target.closest('[data-form]');if(!fm)return;e.preventDefault();var v=formVals(fm),k=fm.dataset.form;
  if(k==='login'&&SERVER_URL){ui.lastId=v.id;srvLogin(String(v.id).trim(),String(v.pin).trim(),false);return;}
  if(k==='loginadm'&&SERVER_URL){srvLogin('admin',String(v.pin).trim(),true);return;}
  if(k==='login'){ui.lastId=v.id;
    if(ui.lock&&Date.now()<ui.lock){ui.err='Demasiados intentos. Espera un minuto.';render();return;}
    var cand=S.socios.filter(function(x){return !x.retirado&&norm(usuarioDe(x))===norm(v.id)&&pinDe(x)&&pinDe(x)===String(v.pin).trim();});
    if(cand.length===1){ui.user={type:'socio',id:cand[0].id};ui.tab='estado';ui.err='';ui.lastId='';ui.fails=0;}
    else if(cand.length>1){ui.err='Hay más de un socio con ese usuario y PIN. Pide al administrador que cambie uno.';}
    else{ui.fails=(ui.fails||0)+1;if(ui.fails>=5){ui.lock=Date.now()+60000;ui.fails=0;ui.err='Demasiados intentos. Espera un minuto.';}else ui.err='Usuario o PIN incorrecto.';}
    render();}
  else if(k==='setpin'){var so0=socioById(ui.user.id),a=String(v.p1).trim(),b=String(v.p2).trim();
    if(!/^\d{6}$/.test(a)){ui.err='El PIN debe tener exactamente 6 dígitos.';}
    else if(a!==b){ui.err='Los dos PIN no coinciden.';}
    else if(/^(\d)\1{5}$/.test(a)||'0123456789012'.indexOf(a)>=0||'9876543210987'.indexOf(a)>=0){ui.err='Ese PIN es muy fácil de adivinar. Elige otro.';}
    else if(String(so0.tel||'').replace(/\D/g,'').slice(-6)===a){ui.err='No uses los últimos dígitos de tu celular.';}
    else if(SERVER_URL){srvPin(a);return;}
    else{so0.pin=a;so0.pinSet=true;save();ui.err='';ui.tab='estado';}
    render();}
  else if(k==='loginadm'){if(String(v.pin)===String(S.cfg.adminPin)){ui.user={type:'admin'};ui.tab='resumen';ui.err='';}else ui.err='Clave incorrecta.';render();}
  else if(k==='resultado'){var r=String(v.r).trim();if(!/^\d{1,2}$/.test(r)){alert('Escribe dos cifras, de 00 a 99.');return;}var cur=fondoCalc().lista.filter(function(x){return x.sorteo.id===ui.sorteo;})[0];cur.sorteo.resultado=pad(parseInt(r,10));cur.sorteo.pago=null;S.notifs=(S.notifs||[]).filter(function(n){return !(n.tipo==='fondo'&&n.sorteo===cur.sorteo.id);});anunciarSorteo(cur.sorteo);save();render();alert('Resultado guardado. Se notificó a todos los socios.');}
  else if(k==='ajustes'){var c=S.cfg;c.nombre=v.nombre||c.nombre;c.inicio=v.inicio||c.inicio;['diaPago','cuotaMin','intSocio','intExterno','multaCuota','multaInteres','comision','precioNum','pctPremio','diaSorteo'].forEach(function(n){c[n]=num(v[n]);});c.baseReparto=v.baseReparto==='cuota'?'cuota':'ahorro';c.multTope=num(v.multTope)||12;c.multaModo=v.multaModo==='mes'?'mes':'dia';c.baseTope='cuota';c.gastosEnvio=num(v.gastosEnvio);c.cobrarMoraInteres=v.cobrarMoraInteres!=='no';c.adminPin=v.adminPin||c.adminPin;c.hoySim=v.hoySim||'';save();render();alert('Ajustes guardados.');}
});

/* ========== modo servidor (opcional): si window.__SERVER tiene la URL del Apps Script ========== */
var CRED=null,SBASE=null,srvN=0;
function srv(q){return fetch(SERVER_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(q)}).then(function(r){return r.json();});}
function srvBusy(on){var o=document.getElementById('srvov');if(on&&!o){o=document.createElement('div');o.id='srvov';o.style.cssText='position:fixed;inset:0;z-index:9999;background:rgba(255,255,255,.55);display:flex;align-items:center;justify-content:center;font-weight:700;color:#1E5A3C';o.textContent='Guardando…';document.body.appendChild(o);}else if(!on&&o)o.remove();}
function srvBase(){
  SBASE={v:S.__v,sol:S.nid.sol,sop:S.nid.sop,not:S.nid.not,cod:{},mine:{},leidaN:{},leidas:[],gan:{}};
  (S.solicitudes||[]).forEach(function(x){if(x.cod)SBASE.cod[x.id]=x.cod.estado;});
  (S.sorteos||[]).forEach(function(sr){Object.keys(sr.numeros||{}).forEach(function(k){var v=sr.numeros[k];if(ui.user&&v&&v.socio===ui.user.id)SBASE.mine[sr.id+'|'+k]=1;});});
  (S.notifs||[]).forEach(function(n){SBASE.leidaN[n.id]=!!n.leida;});
  if(ui.user&&ui.user.type==='socio'){SBASE.leidas=((S.leidas||{})[ui.user.id]||[]).slice();}
  (S.ganadores||[]).forEach(function(g){if((S.leidas||{})['gan'+g.id])SBASE.gan[g.id]=1;});
}
function srvPatch(){
  var me=ui.user.id,p={solicitudesNuevas:[],codResp:[],soportesNuevos:[],numeros:{},notifsNuevas:[],notifsLeidas:[],leidas:[],felicitaciones:[]},n=0;
  (S.solicitudes||[]).forEach(function(x){if(x.id>=SBASE.sol&&x.socio===me){p.solicitudesNuevas.push(x);n++;}else if(x.codeudor===me&&x.cod&&x.cod.estado!=='pendiente'&&SBASE.cod[x.id]==='pendiente'){p.codResp.push({id:x.id,estado:x.cod.estado});n++;}});
  (S.soportes||[]).forEach(function(x){if(x.id>=SBASE.sop&&x.socio===me){p.soportesNuevos.push(x);n++;}});
  (S.sorteos||[]).forEach(function(sr){var d={};Object.keys(sr.numeros||{}).forEach(function(k){var v=sr.numeros[k];if(v&&v.socio===me&&!SBASE.mine[sr.id+'|'+k]){d[k]={socio:me,pagado:false};n++;}});
    Object.keys(SBASE.mine).forEach(function(key){var a=key.split('|');if(String(a[0])!==String(sr.id))return;var v=sr.numeros&&sr.numeros[a[1]];if(!(v&&v.socio===me)){d[a[1]]=null;n++;}});
    if(Object.keys(d).length)p.numeros[sr.id]=d;});
  (S.notifs||[]).forEach(function(x){if(x.id>=SBASE.not&&x.para!==me){p.notifsNuevas.push({para:x.para,texto:x.texto,tipo:x.tipo,sol:x.sol,sop:x.sop});n++;}else if(x.para===me&&x.leida&&SBASE.leidaN[x.id]===false){p.notifsLeidas.push(x.id);n++;}});
  var l=(S.leidas||{})[me]||[];if(l.some(function(k){return SBASE.leidas.indexOf(k)<0;})){p.leidas=l.slice();n++;}
  (S.ganadores||[]).forEach(function(g){if(g.socio===me&&(S.leidas||{})['gan'+g.id]&&!SBASE.gan[g.id]){p.felicitaciones.push(g.id);n++;}});
  return n?p:null;
}
function srvAdoptar(est,v){S=fix(est);S.__v=v;srvBase();}
function srvSave(){
  if(!CRED||!ui.user)return;var tipo=ui.user.type;
  if(tipo==='socio'){var p=srvPatch();if(!p)return;srvBusy(true);
    srv({accion:'socio',usuario:CRED.usuario,pin:CRED.pin,patch:p}).then(function(r){srvBusy(false);if(r.ok){srvAdoptar(r.estado,r.v);}else{alert('No se pudo guardar ('+(r.error||'error')+'). Intenta de nuevo.');}render();}).catch(function(){srvBusy(false);alert('Sin conexión con el servidor. Tu último cambio no se guardó.');});
  }else{srvBusy(true);var np=S.cfg.adminPin&&String(S.cfg.adminPin).length>=4?String(S.cfg.adminPin):null;
    srv({accion:'guardar',usuario:'admin',pin:CRED.pin,estado:S,v:S.__v}).then(function(r){srvBusy(false);
      if(r.ok){S.__v=r.v;if(np){CRED.pin=np;}delete S.cfg.adminPin;SBASE=SBASE||{};}
      else if(r.error==='conflicto'){alert('Un socio hizo un cambio mientras trabajabas. Cargué la versión nueva: repite tu último cambio.');srvAdoptar(r.estado,r.v);}
      else{alert('No se pudo guardar ('+(r.error||'error')+').');}render();}).catch(function(){srvBusy(false);alert('Sin conexión con el servidor. Tu último cambio no se guardó.');});}
}
function srvLogin(usuario,pin,esAdm){ui.err='';srvBusy(true);
  srv({accion:'estado',usuario:usuario,pin:pin}).then(function(r){srvBusy(false);
    if(r.error==='bloqueado')ui.err='Demasiados intentos. Espera 15 minutos.';
    else if(r.error)ui.err=esAdm?'Clave incorrecta.':'Usuario o PIN incorrecto.';
    else{CRED={usuario:usuario,pin:pin};ui.user=r.sesion.tipo==='admin'?{type:'admin'}:{type:'socio',id:r.sesion.id};ui.tab=r.sesion.tipo==='admin'?'resumen':'estado';ui.err='';ui.lastId='';srvAdoptar(r.estado,r.v);}
    render();}).catch(function(){srvBusy(false);ui.err='No hay conexión con el servidor.';render();});}
function srvPin(nuevo){srvBusy(true);
  srv({accion:'crearPin',usuario:CRED.usuario,pin:CRED.pin,nuevoPin:nuevo}).then(function(r){
    if(!r.ok){srvBusy(false);ui.err=r.error==='pin_debil'?'Ese PIN es muy fácil de adivinar. Elige otro.':'No se pudo guardar el PIN.';render();return;}
    CRED.pin=nuevo;return srv({accion:'estado',usuario:CRED.usuario,pin:nuevo}).then(function(r2){srvBusy(false);if(r2.ok){srvAdoptar(r2.estado,r2.v);ui.err='';ui.tab='estado';}render();});
  }).catch(function(){srvBusy(false);ui.err='Sin conexión con el servidor.';render();});}
function srvSalir(){CRED=null;SBASE=null;S=fix(defaults());S.cfg.nombre=SRV_NOMBRE||S.cfg.nombre;}
var SRV_NOMBRE='',SRV_LISTO=true;
if(SERVER_URL){setInterval(function(){if(!CRED||document.getElementById('ov')||document.getElementById('srvov'))return;
  srv({accion:'version',usuario:CRED.usuario,pin:CRED.pin}).then(function(r){if(!r.ok||r.v===S.__v)return;if(document.getElementById('ov'))return;
    srv({accion:'estado',usuario:CRED.usuario,pin:CRED.pin}).then(function(r2){if(r2.ok&&!document.getElementById('ov')){srvAdoptar(r2.estado,r2.v);render();}});}).catch(function(){});},60000);}

if(SERVER_URL){S=fix(defaults());S.cfg.nombre='La Cosecha';srv({accion:'info'}).then(function(r){if(r&&r.nombre){SRV_NOMBRE=r.nombre;S.cfg.nombre=r.nombre;}if(r&&r.listo===false)SRV_LISTO=false;render();}).catch(function(){});}else{S=load();if(!S){S=seedDemo();save();}}try{__snap=snapOf();__snapS=S;}catch(e){}
window.__cosecha={pinDe:pinDe,pdfSocio:pdfSocio,pdfGeneral:pdfGeneral,pdfInterno:pdfInterno,get S(){return S;},set S(v){S=v;},hoy:hoy,cuotaInfo:cuotaInfo,prestamoInfo:prestamoInfo,fondoCalc:fondoCalc,liquidacion:liquidacion,ahorroSocio:ahorroSocio,seedDemo:seedDemo,defaults:defaults,render:render,ui:ui,mesFecha:mesFecha,addDays:addDays,diff:diff};
render();
